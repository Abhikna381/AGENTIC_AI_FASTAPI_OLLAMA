<!DOCTYPE html>
<html>
<head>
    <title>AI Image Caption</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 600px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Chat Box */
        .chat-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-height: 350px;
            margin-bottom: 15px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user {
            background: #334155;
            text-align: right;
            margin-left: auto;
        }

        .bot {
            background: #0ea5e9;
            text-align: left;
            color: white;
        }

        /* Upload Box */
        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .upload-box.dragover {
            background: #1e40af;
        }

        input {
            display: none;
        }

        /* Buttons */
        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        img.preview {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🤖 AI Image Caption</h1>

    <div class="chat-box" id="chatBox"></div>

    <div class="upload-box" id="uploadBox">
        Drag & Drop Image OR Click to Upload
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="controls">
        <button onclick="startVoice()">🎤 Speak</button>
        <button onclick="uploadImage()">Generate Caption</button>
    </div>
</div>

<script>
    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const chatBox = document.getElementById("chatBox");

    let selectedFile = null;

    // Click upload
    uploadBox.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        selectedFile = e.target.files[0];
        addMessage("🖼 Image selected", "user");

        showPreview(selectedFile);
    };

    // Drag & Drop
    uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.classList.add("dragover");
    });

    uploadBox.addEventListener("dragleave", () => {
        uploadBox.classList.remove("dragover");
    });

    uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadBox.classList.remove("dragover");

        selectedFile = e.dataTransfer.files[0];
        addMessage("🖼 Image dropped", "user");

        showPreview(selectedFile);
    });

    // Show image preview
    function showPreview(file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            addMessage(`<img src="${e.target.result}" class="preview">`, "user");
        };
        reader.readAsDataURL(file);
    }

    // Voice Input
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function startVoice() {
        if (!SpeechRecognition) {
            alert("Voice not supported in this browser");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.start();

        addMessage("🎤 Listening...", "bot");

        recognition.onresult = function(event) {
            const text = event.results[0][0].transcript;
            addMessage(text, "user");
        };

        recognition.onerror = function() {
            addMessage("❌ Voice error", "bot");
        };
    }

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "message " + type;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function uploadImage() {
        if (!selectedFile) {
            alert("Please select an image first!");
            return;
        }

        addMessage("⏳ Processing...", "bot");

        const loader = document.createElement("div");
        loader.className = "loader";
        chatBox.appendChild(loader);

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
            const response = await fetch("/upload-image", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            loader.remove();

            addMessage(`<pre>${data.caption}</pre>`, "bot");

        } catch (error) {
            loader.remove();
            addMessage("❌ Error occurred", "bot");
        }
    }
</script>

</body>
</html>
