<!DOCTYPE html>
<html>
<head>
    <title>AI Image Caption</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 600px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Chat Box */
        .chat-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-height: 300px;
            margin-bottom: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
        }

        .user {
            background: #334155;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #1e40af;
            text-align: left;
        }

        /* Upload box */
        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-box:hover {
            background: #1e40af;
        }

        .upload-box.dragover {
            background: #1e40af;
        }

        input {
            display: none;
        }

        button {
            margin-top: 10px;
            padding: 10px 18px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🤖 AI Image Caption</h1>

    <div class="chat-box" id="chatBox"></div>

    <div class="upload-box" id="uploadBox">
        Drag & Drop Image OR Click to Upload
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="btn-row">
        <button onclick="uploadImage()">Generate Caption</button>
        <button onclick="startVoice()">🎤 Speak</button>
    </div>

    <div class="btn-row">
        <button onclick="readCaption()">🔊 Read</button>
        <button onclick="stopReading()">⏹️ Stop</button>
    </div>
</div>

<script>
    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const chatBox = document.getElementById("chatBox");

    let selectedFile = null;
    let currentCaption = "";
    let speech = null;

    // Click upload
    uploadBox.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        selectedFile = e.target.files[0];
        addMessage("🖼 Image selected", "user");
    };

    // Drag & Drop
    uploadBox.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadBox.classList.add("dragover");
    });

    uploadBox.addEventListener("dragleave", () => {
        uploadBox.classList.remove("dragover");
    });

    uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadBox.classList.remove("dragover");

        selectedFile = e.dataTransfer.files[0];
        addMessage("🖼 Image dropped", "user");
    });

    // Add messages
    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "message " + type;
        div.innerText = text;

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (type === "bot") {
            currentCaption = text;
        }
    }

    // Upload Image
    async function uploadImage() {
        if (!selectedFile) {
            alert("Please select an image first!");
            return;
        }

        addMessage("⏳ Processing...", "bot");

        const loader = document.createElement("div");
        loader.className = "loader";
        chatBox.appendChild(loader);

        const formData = new FormData();
        formData.append("file", selectedFile);

        try {
            const response = await fetch("/upload-image", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            loader.remove();

            addMessage(data.caption, "bot");

        } catch (error) {
            loader.remove();
            addMessage("❌ Error occurred", "bot");
        }
    }

    // 🎤 Voice Input
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function startVoice() {
        if (!SpeechRecognition) {
            alert("Voice not supported");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.start();

        addMessage("🎤 Listening...", "bot");

        recognition.onresult = function(event) {
            const text = event.results[0][0].transcript;
            addMessage(text, "user");
        };

        recognition.onerror = function() {
            addMessage("❌ Voice error", "bot");
        };
    }

    // 🔊 Read Caption
    function readCaption() {
        if (!currentCaption) {
            alert("No caption to read!");
            return;
        }

        speech = new SpeechSynthesisUtterance(currentCaption);
        speech.lang = "en-US";

        window.speechSynthesis.speak(speech);
    }

    // ⏹️ Stop
    function stopReading() {
        window.speechSynthesis.cancel();
    }

</script>

</body>
</html>
