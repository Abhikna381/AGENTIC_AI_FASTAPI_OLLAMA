<!DOCTYPE html>
<html>
<head>
    <title>ANKITA'S AKSHAT AI IMAGE CAPTION</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 650px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        .chat-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-height: 250px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            background: #334155;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #1e40af;
            text-align: left;
        }

        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
        }

        .upload-box:hover {
            background: #1e40af;
        }

        input {
            display: none;
        }

        .preview img {
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            border: 2px solid #38bdf8;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0ea5e9;
        }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Typing dots */
        .typing {
            display: inline-flex;
            gap: 4px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #38bdf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 ANKITA'S AKSHAT AI IMAGE CAPTION</h1>

    <div class="chat-box" id="chatBox"></div>

    <!-- Upload -->
    <div class="upload-box" id="uploadBox">
        Drag & Drop Image OR Click to Upload
        <input type="file" id="fileInput" accept="image/*">
        <div class="preview" id="preview"></div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
        <button onclick="uploadImage()">Generate Caption</button>
        <button onclick="startVoice()">🎤 Speak</button>
    </div>

    <div class="btn-row">
        <button onclick="readCaption()">🔊 Read</button>
        <button onclick="stopReading()">⏹️ Stop</button>
    </div>

</div>

<script>

const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const chatBox = document.getElementById("chatBox");
const preview = document.getElementById("preview");

let selectedFile = null;
let currentCaption = "";
let speech = null;

/* ================= UPLOAD ================= */
uploadBox.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
    selectedFile = e.target.files[0];
    showPreview(selectedFile);
    addMessage("🖼 Image selected", "user");
};

uploadBox.addEventListener("dragover", (e) => {
    e.preventDefault();
});

uploadBox.addEventListener("drop", (e) => {
    e.preventDefault();
    selectedFile = e.dataTransfer.files[0];
    showPreview(selectedFile);
    addMessage("🖼 Image dropped", "user");
});

/* ================= PREVIEW ================= */
function showPreview(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        preview.innerHTML = `<img src="${e.target.result}">`;
    };
    reader.readAsDataURL(file);
}

/* ================= CHAT ================= */
function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    if (type === "bot") currentCaption = text;
}

/* ================= TYPING ANIMATION ================= */
function showTyping() {
    const div = document.createElement("div");
    div.className = "message bot";
    div.id = "typing";

    div.innerHTML = `
        <div class="typing">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    `;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById("typing");
    if (el) el.remove();
}

/* ================= STREAMING TEXT ================= */
function streamText(text, element, speed = 25) {
    let i = 0;
    element.innerHTML = "";

    function type() {
        if (i < text.length) {
            element.innerHTML += text.charAt(i);
            i++;
            chatBox.scrollTop = chatBox.scrollHeight;
            setTimeout(type, speed);
        }
    }

    type();
}

/* ================= UPLOAD IMAGE ================= */
async function uploadImage() {
    if (!selectedFile) {
        alert("Please select an image!");
        return;
    }

    addMessage("📤 Uploading...", "user");
    showTyping();

    const formData = new FormData();
    formData.append("file", selectedFile);

    try {
        const res = await fetch("/upload-image", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        removeTyping();

        const div = document.createElement("div");
        div.className = "message bot";
        chatBox.appendChild(div);

        currentCaption = data.caption;

        streamText(data.caption, div, 20);

    } catch (err) {
        removeTyping();
        addMessage("❌ Error occurred", "bot");
    }
}

/* ================= VOICE ================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function startVoice() {
    if (!SpeechRecognition) {
        alert("Not supported");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    addMessage("🎤 Listening...", "bot");

    recognition.onresult = (e) => {
        addMessage(e.results[0][0].transcript, "user");
    };
}

/* ================= READ / STOP ================= */
function readCaption() {
    if (!currentCaption) return alert("No caption");

    speech = new SpeechSynthesisUtterance(currentCaption);
    window.speechSynthesis.speak(speech);
}

function stopReading() {
    window.speechSynthesis.cancel();
}

</script>

</body>
</html>
