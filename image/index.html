<!DOCTYPE html>
<html>
<head>
<title>ANKITA GPT</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#0b1220;
    color:white;
    display:flex;
    justify-content:center;
}

.container { width:700px; }

.chat {
    height:420px;
    overflow-y:auto;
    background:#093896;
    padding:10px;
    border-radius:10px;
}

.msg {
    padding:10px;
    margin:5px;
    border-radius:10px;
    max-width:80%;
    white-space: pre-wrap;
}

.user { background:#374151; margin-left:auto; }
.bot { background:#1d4ed8; }

.controls {
    display:flex;
    gap:5px;
}

button {
    padding:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

input {
    width:100%;
    padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>🤖 ANKITA'S AKSHAT AI CAPTION GENERATOR</h2>

<div id="loginBox">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    
    <button onclick="login()">Login</button>
    
    <!-- ✅ NEW REGISTER BUTTON -->
    <button onclick="register()" style="background:#16a34a;">
        Register
    </button>
</div>

<div id="chat" class="chat"></div>

<input id="msg" placeholder="Ask about image or anything">

<div class="controls">
    <button onclick="sendMsg()">Send</button>
    <button onclick="startVoice()">🎤 Speak</button>
    <button onclick="stopAll()">⏹ Stop</button>
</div>

<input type="file" id="file">
<button onclick="generateCaption()">🖼 Generate Caption</button>
<button onclick="readCaption()">🔊 Read Caption</button>

</div>

<script>

let token = localStorage.getItem("token") || "";
let recognition;
let speaking = false;
let lastCaption = "";

/* AUTO LOGIN */
window.onload = function(){
    if (token){
        document.getElementById("loginBox").style.display = "none";
        add("✅ Logged in from saved session", "bot");
    } else {
        add("⚠️ Please Register first then login", "bot");
    }
};


/* ADD MESSAGE */
function add(text,type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

/* STREAM EFFECT */
function streamText(element, text){
    element.innerText = "";
    let i = 0;

    let interval = setInterval(()=>{
        element.innerText += text[i];
        i++;
        if(i >= text.length){
            clearInterval(interval);
        }
    }, 15);
}

/* LOGIN (FIXED) */
async function login(){

    let params = new URLSearchParams();
    params.append("username", username.value);
    params.append("password", password.value);
    params.append("grant_type", "password"); // 🔥 IMPORTANT

    let res = await fetch("/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/x-www-form-urlencoded"
        },
        body: params
    });

    let data = await res.json();
    console.log("LOGIN:", data);

    if (!data.access_token){
        alert("❌ Login failed: " + JSON.stringify(data));
        return;
    }

    token = data.access_token;
    localStorage.setItem("token", token);


    add("✅ Login successful", "bot");
    document.getElementById("loginBox").style.display = "none";
}

/* ✅ REGISTER */
async function register(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    if (!username || !password){
        alert("Enter username & password");
        return;
    }

    try {
        let res = await fetch("/register", {
            method: "POST",
            headers:{
                "Content-Type":"application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        let data = await res.json();

        console.log("REGISTER:", data);

        if (res.ok){
            add("✅ Registered successfully. Now login.", "bot");
        } else {
            add("❌ Register failed: " + JSON.stringify(data), "bot");
        }

    } catch (err){
        console.log(err);
        add("❌ Server error during register", "bot");
    }
}

/* CHAT */
async function sendMsg(){

    if (!token){
        alert("Login first");
        return;
    }

    let msg = document.getElementById("msg").value;
    if (!msg) return;

    add(msg,"user");

    let botDiv = add("...", "bot");

    let res = await fetch("/chat",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();
    console.log("CHAT:", data);

    console.log("TOKEN USED:", token);

    if (data.detail){
        streamText(botDiv, "❌ " + data.detail);
        return;
    }

    let reply = data.reply || JSON.stringify(data);

    streamText(botDiv, reply);

    speak(reply);
}

/* IMAGE + CAPTION */
async function generateCaption(){

    if (!token){
        alert("Login first");
        return;
    }

    let file = document.getElementById("file").files[0];
    if (!file){
        alert("Select image");
        return;
    }

    let form = new FormData();
    form.append("file", file);

    let res = await fetch("/upload-image",{
        method:"POST",
        headers:{
            "Authorization":"Bearer "+token
        },
        body: form
    });

    let data = await res.json();
    console.log("IMAGE:", data);

    lastCaption = data.caption;
    add("🖼 " + lastCaption,"bot");

    speak(lastCaption);
}

/* 🔊 SPEAK */
function speak(text){

    speechSynthesis.cancel(); // stop previous
    let speech = new SpeechSynthesisUtterance(text);

    speaking = true;

    speech.onend = () => speaking = false;

    speechSynthesis.speak(speech);
}

/* 🔊 READ CAPTION */
function readCaption(){
    if (!lastCaption){
        alert("No caption available");
        return;
    }
    speak(lastCaption);
}

/* 🎤 VOICE INPUT */
function startVoice(){

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";

    recognition.onresult = function(e){
        let text = e.results[0][0].transcript;
        document.getElementById("msg").value = text;
        sendMsg();
    };

    recognition.start();
}

/* ⏹ STOP EVERYTHING */
function stopAll(){

    // stop voice input
    if (recognition){
        recognition.stop();
    }

    // stop speaking
    if (speaking){
        speechSynthesis.cancel();
        speaking = false;
    }
}

</script>

</body>
</html>
