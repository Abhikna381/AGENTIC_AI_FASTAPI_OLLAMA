<!DOCTYPE html>
<html>
<head>
    <title>ANKITA'S AKSHAT AI IMAGE CAPTION</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 650px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Chat Box */
        .chat-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-height: 250px;
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user {
            background: #334155;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #1e40af;
            text-align: left;
        }

        /* Upload box */
        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-box:hover {
            background: #1e40af;
        }

        .upload-box.dragover {
            background: #1e40af;
        }

        input {
            display: none;
        }

        /* Image Preview */
        .preview {
            margin-top: 10px;
            text-align: center;
        }

        .preview img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px solid #38bdf8;
        }

        /* Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            padding: 10px 15px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 ANKITA'S AKSHAT AI IMAGE CAPTION</h1>

    <div class="chat-box" id="chatBox"></div>

    <!-- Upload -->
    <div class="upload-box" id="uploadBox">
        Drag & Drop Image OR Click to Upload
        <input type="file" id="fileInput" accept="image/*">
        
        <!-- IMAGE PREVIEW -->
        <div class="preview" id="preview"></div>
    </div>

    <!-- Buttons -->
    <div class="btn-row">
        <button onclick="uploadImage()">Generate Caption</button>
        <button onclick="startVoice()">🎤 Speak</button>
    </div>

    <div class="btn-row">
        <button onclick="readCaption()">🔊 Read</button>
        <button onclick="stopReading()">⏹️ Stop</button>
    </div>

</div>

<script>
const uploadBox = document.getElementById("uploadBox");
const fileInput = document.getElementById("fileInput");
const chatBox = document.getElementById("chatBox");
const preview = document.getElementById("preview");

let selectedFile = null;
let currentCaption = "";
let speech = null;

/* =========================
   CLICK UPLOAD
========================= */
uploadBox.onclick = () => fileInput.click();

fileInput.onchange = (e) => {
    selectedFile = e.target.files[0];
    showPreview(selectedFile);
    addMessage("🖼 Image selected", "user");
};

/* =========================
   DRAG & DROP
========================= */
uploadBox.addEventListener("dragover", (e) => {
    e.preventDefault();
    uploadBox.classList.add("dragover");
});

uploadBox.addEventListener("dragleave", () => {
    uploadBox.classList.remove("dragover");
});

uploadBox.addEventListener("drop", (e) => {
    e.preventDefault();
    uploadBox.classList.remove("dragover");

    selectedFile = e.dataTransfer.files[0];
    showPreview(selectedFile);
    addMessage("🖼 Image dropped", "user");
});

/* =========================
   IMAGE PREVIEW FUNCTION
========================= */
function showPreview(file) {
    const reader = new FileReader();

    reader.onload = function(e) {
        preview.innerHTML = `<img src="${e.target.result}" />`;
    };

    reader.readAsDataURL(file);
}

/* =========================
   CHAT MESSAGE
========================= */
function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    if (type === "bot") {
        currentCaption = text;
    }
}

/* =========================
   UPLOAD IMAGE TO BACKEND
========================= */
async function uploadImage() {
    if (!selectedFile) {
        alert("Please select an image first!");
        return;
    }

    addMessage("⏳ Processing...", "bot");

    const loader = document.createElement("div");
    loader.className = "loader";
    chatBox.appendChild(loader);

    const formData = new FormData();
    formData.append("file", selectedFile);

    try {
        const response = await fetch("/upload-image", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        loader.remove();
        addMessage(data.caption, "bot");

    } catch (error) {
        loader.remove();
        addMessage("❌ Error occurred", "bot");
    }
}

/* =========================
   VOICE INPUT
========================= */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function startVoice() {
    if (!SpeechRecognition) {
        alert("Voice not supported in this browser");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.start();

    addMessage("🎤 Listening...", "bot");

    recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        addMessage(text, "user");
    };

    recognition.onerror = function() {
        addMessage("❌ Voice error", "bot");
    };
}

/* =========================
   READ CAPTION
========================= */
function readCaption() {
    if (!currentCaption) {
        alert("No caption to read!");
        return;
    }

    speech = new SpeechSynthesisUtterance(currentCaption);
    speech.lang = "en-US";

    window.speechSynthesis.speak(speech);
}

/* =========================
   STOP SPEECH
========================= */
function stopReading() {
    window.speechSynthesis.cancel();
}
</script>

</body>
</html>
