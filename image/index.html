<!DOCTYPE html>
<html>
<head>
    <title>AI Image Caption</title>

    <!-- ✅ Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 600px;
            margin-top: 40px;
        }

        h1 {
            text-align: center;
        }

        .chat-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            min-height: 350px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user {
            background: #334155;
            margin-left: auto;
        }

        .bot {
            background: #0ea5e9;
        }

        .upload-box {
            border: 2px dashed #38bdf8;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .upload-box.dragover {
            background: #1e40af;
        }

        input {
            display: none;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 10px;
            background: #38bdf8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0ea5e9;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        img.preview {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🤖 AI Image Caption</h1>

    <div class="chat-box" id="chatBox"></div>

    <div class="upload-box" id="uploadBox">
        Drag & Drop Image OR Click to Upload
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="controls">
        <button onclick="startVoice()">🎤 Speak</button>
        <button onclick="stopVoice()">⛔ Stop</button>
        <button onclick="readLastMessage()">🔊 Read</button>
        <button onclick="uploadImage()">Generate</button>
    </div>
</div>

<script>
    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const chatBox = document.getElementById("chatBox");

    let selectedFile = null;
    let recognition;

    uploadBox.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
        selectedFile = e.target.files[0];
        addMessage("🖼 Image selected", "user");
        previewImage(selectedFile);
    };

    uploadBox.addEventListener("drop", (e) => {
        e.preventDefault();
        selectedFile = e.dataTransfer.files[0];
        addMessage("🖼 Image dropped", "user");
        previewImage(selectedFile);
    });

    function previewImage(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            addMessage(`<img src="${e.target.result}" class="preview">`, "user");
        };
        reader.readAsDataURL(file);
    }

    function addMessage(text, type) {
        const div = document.createElement("div");
        div.className = "message " + type;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // 🎤 Voice
    function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            alert("Voice not supported");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.start();

        addMessage("🎤 Listening...", "bot");

        recognition.onresult = (event) => {
            const text = event.results[0][0].transcript;
            addMessage(text, "user");
        };
    }

    function stopVoice() {
        if (recognition) {
            recognition.stop();
            addMessage("🛑 Stopped", "bot");
        }
    }

    // 🔊 Read
    function readLastMessage() {
        const msgs = document.querySelectorAll(".bot");
        if (msgs.length === 0) return;

        const text = msgs[msgs.length - 1].innerText;
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
    }

    // 🚀 Upload
    async function uploadImage() {
        if (!selectedFile) {
            alert("Select image first");
            return;
        }

        addMessage("⏳ Processing...", "bot");

        const loader = document.createElement("div");
        loader.className = "loader";
        chatBox.appendChild(loader);

        const formData = new FormData();
        formData.append("file", selectedFile);

        const res = await fetch("/upload-image", {
            method: "POST",
            body: formData
        });

        const data = await res.json();
        loader.remove();

        addMessage(`<pre>${data.caption}</pre>`, "bot");

        // 🔊 Auto speak
        speechSynthesis.speak(new SpeechSynthesisUtterance(data.caption));
    }
</script>

</body>
</html>
