<!DOCTYPE html>
<html>
<head>
<title>ANKITA'S AKSHAT AI</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 700px;
    margin-top: 20px;
}

h1 {
    text-align: center;
}

.chat {
    height: 400px;
    overflow-y: auto;
    background: #111827;
    padding: 10px;
    border-radius: 10px;
}

.msg {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
}

.user { background: #374151; margin-left: auto; }
.bot { background: #1d4ed8; }

input, button {
    padding: 10px;
    margin: 5px;
}

.preview {
    width: 100%;
    display: none;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ANKITA'S AKSHAT AI</h1>

<!-- REGISTER -->
<h3>Register</h3>
<input id="ruser" placeholder="username">
<input id="rpass" type="password" placeholder="password">
<button onclick="register()">Register</button>

<!-- LOGIN -->
<h3>Login</h3>
<input id="luser" placeholder="username">
<input id="lpass" type="password" placeholder="password">
<button onclick="login()">Login</button>

<div class="chat" id="chat"></div>

<input id="msg" placeholder="Ask something..." style="width:100%">
<button onclick="send()">Send</button>

<!-- IMAGE -->
<input type="file" id="file">
<img id="preview" class="preview">
<button onclick="upload()">Upload Image</button>

</div>

<script>

let token = "";

function add(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

/* REGISTER */
async function register(){
    let res = await fetch("/register", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            username: ruser.value,
            password: rpass.value
        })
    });

    let data = await res.json();
    alert(data.message || data.detail);
}

/* LOGIN */
async function login(){
    let res = await fetch("/login", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            username: luser.value,
            password: lpass.value
        })
    });

    let data = await res.json();
    token = data.access_token;
    alert("Logged in!");
}

/* CHAT */
async function send(){
    let msg = document.getElementById("msg").value;

    add(msg,"user");

    let res = await fetch("/chat", {
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();
    add(data.reply,"bot");
}

/* IMAGE */
file.onchange = e=>{
    preview.src = URL.createObjectURL(file.files[0]);
    preview.style.display="block";
}

async function upload(){
    let form = new FormData();
    form.append("file", file.files[0]);

    let res = await fetch("/upload-image", {
        method:"POST",
        body: form
    });

    let data = await res.json();
    add(data.caption,"bot");
}

</script>

</body>
</html>
