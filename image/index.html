<!DOCTYPE html>
<html>
<head>
<title>ANKITA'S AKSHAT AI</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 700px;
    margin-top: 20px;
}

h1 {
    text-align: center;
    font-size: 26px;
}

.chat {
    height: 420px;
    overflow-y: auto;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
}

.msg {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    max-width: 80%;
}

.user { background: #374151; margin-left: auto; }
.bot { background: #1d4ed8; }

.upload {
    border: 2px dashed #3b82f6;
    padding: 15px;
    margin-top: 10px;
    text-align: center;
    border-radius: 10px;
}

.preview {
    width: 100%;
    margin-top: 10px;
    display: none;
    border-radius: 10px;
}

button {
    padding: 10px;
    margin: 5px;
    background: #3b82f6;
    border: none;
    color: white;
    border-radius: 8px;
}

video {
    width: 100%;
    display: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ANKITA'S AKSHAT AI</h1>

<!-- LOGIN -->
<input id="user" placeholder="username">
<input id="pass" placeholder="password" type="password">
<button onclick="login()">Login</button>

<div class="chat" id="chat"></div>

<input type="text" id="msg" placeholder="Ask something..." style="width:100%; padding:10px;">
<button onclick="sendMsg()">Send</button>

<!-- IMAGE -->
<div class="upload" onclick="file.click()">
Upload / Drag Image
<input type="file" id="file" hidden>
<img id="preview" class="preview">
</div>

<button onclick="upload()">Generate Caption</button>

<video id="video"></video>
<canvas id="canvas" style="display:none;"></canvas>

</div>

<script>

let fileData = null;
let token = "";
let lastText = "";

const chat = document.getElementById("chat");
const file = document.getElementById("file");
const preview = document.getElementById("preview");

file.onchange = e => {
    fileData = e.target.files[0];
    preview.src = URL.createObjectURL(fileData);
    preview.style.display = "block";
};

function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* LOGIN */
async function login() {
    let form = new FormData();
    form.append("username", document.getElementById("user").value);
    form.append("password", document.getElementById("pass").value);

    let res = await fetch("/login", { method:"POST", body: form });
    let data = await res.json();

    token = data.access_token;
    alert("Logged in!");
}

/* CHAT */
async function sendMsg() {
    let msg = document.getElementById("msg").value;
    add(msg, "user");

    let res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();
    add(data.reply, "bot");
}

/* IMAGE UPLOAD */
async function upload() {
    let form = new FormData();
    form.append("file", fileData);

    let res = await fetch("/upload-image", {
        method: "POST",
        body: form
    });

    let data = await res.json();
    add(data.caption, "bot");
}

</script>

</body>
</html>
