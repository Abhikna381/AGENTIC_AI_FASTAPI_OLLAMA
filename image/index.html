<!DOCTYPE html>
<html>
<head>
<title>ANKITA'S AKSHAT AI</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 750px;
    margin-top: 20px;
}

h1 {
    text-align: center;
}

.chat {
    height: 400px;
    overflow-y: auto;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
}

.msg {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    max-width: 80%;
}

.user { background: #374151; margin-left: auto; }
.bot { background: #1d4ed8; }

input, button {
    padding: 10px;
    margin-top: 8px;
    border-radius: 8px;
}

button {
    background: #3b82f6;
    color: white;
    border: none;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ANKITA'S AKSHAT AI</h1>

<!-- LOGIN -->
<div>
    <input id="u" placeholder="username">
    <input id="p" type="password" placeholder="password">
    <button onclick="login()">Login</button>
</div>

<br>

<div class="chat" id="chat"></div>

<input id="msg" placeholder="ask something..." style="width:100%">
<button onclick="send()">Send</button>

<input type="file" id="file">
<button onclick="upload()">Upload Image</button>

</div>

<script>

let token = "";
const chat = document.getElementById("chat");

function add(text, type){
    let d = document.createElement("div");
    d.className = "msg " + type;
    d.innerText = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
}

/* LOGIN */
async function login(){
    let form = new FormData();
    form.append("username", document.getElementById("u").value);
    form.append("password", document.getElementById("p").value);

    let res = await fetch("/login", {
        method: "POST",
        body: form
    });

    let data = await res.json();
    token = data.access_token;

    add("Logged in!", "bot");
}

/* CHAT */
async function send(){
    let msg = document.getElementById("msg").value;

    add(msg, "user");

    let res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();

    stream(data.reply);
}

/* STREAM EFFECT */
function stream(text){
    let d = document.createElement("div");
    d.className = "msg bot";
    chat.appendChild(d);

    let i = 0;
    let interval = setInterval(() => {
        d.innerText += text[i];
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 15);
}

/* IMAGE */
async function upload(){
    let file = document.getElementById("file").files[0];

    let form = new FormData();
    form.append("file", file);

    let res = await fetch("/upload-image", {
        method: "POST",
        body: form
    });

    let data = await res.json();
    stream(data.caption);
}

</script>

</body>
</html>
