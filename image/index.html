<!DOCTYPE html>
<html>
<head>
<title>ChatGPT Clone</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 700px;
    margin-top: 20px;
}

h1 {
    text-align: center;
}

/* CHAT */
.chat {
    height: 400px;
    overflow-y: auto;
    background: #111827;
    padding: 15px;
    border-radius: 12px;
}

.msg {
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
}

.user { background: #374151; text-align: right; }
.bot { background: #1d4ed8; }

/* INPUT */
input, button {
    padding: 10px;
    margin: 5px;
    border-radius: 8px;
    border: none;
}

button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #2563eb;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 CHATGPT CLONE</h1>

<!-- LOGIN -->
<div>
    <input id="user" placeholder="username">
    <input id="pass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<input id="msg" placeholder="message">
<button onclick="send()">Send</button>

<button onclick="startVoice()">🎤 Voice</button>
<button onclick="read()">🔊 Read</button>
<button onclick="stop()">⏹ Stop</button>

</div>

<script>

let token = "";
let lastText = "";
const chat = document.getElementById("chat");

function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    if(type === "bot") lastText = text;
}

/* LOGIN */
async function login() {
    let form = new URLSearchParams();
    form.append("username", document.getElementById("user").value);
    form.append("password", document.getElementById("pass").value);

    let res = await fetch("/login", {
        method: "POST",
        body: form
    });

    let data = await res.json();
    token = data.access_token;

    alert("Login success");
}

/* CHAT */
async function send() {
    let msg = document.getElementById("msg").value;
    add(msg, "user");

    let res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();
    add(data.reply, "bot");
}

/* VOICE */
function startVoice() {
    let rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = "en-US";
    rec.start();

    rec.onresult = e => {
        document.getElementById("msg").value = e.results[0][0].transcript;
    };
}

/* READ */
function read() {
    let speech = new SpeechSynthesisUtterance(lastText);
    window.speechSynthesis.speak(speech);
}

/* STOP */
function stop() {
    window.speechSynthesis.cancel();
}

</script>

</body>
</html>
