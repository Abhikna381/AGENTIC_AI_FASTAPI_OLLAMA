<!DOCTYPE html>
<html>
<head>
<title>ANKITA'S AKSHAT AI IMAGE CAPTION CHATBOT</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 700px;
    margin-top: 20px;
}

h1 {
    text-align: center;
}

.chat {
    height: 350px;
    overflow-y: auto;
    background: #111827;
    padding: 10px;
    border-radius: 10px;
}

.msg {
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
}

.user { background: #374151; text-align: right; }
.bot { background: #1d4ed8; }

.preview {
    width: 100%;
    margin-top: 10px;
    display: none;
}

input, button {
    padding: 10px;
    margin: 5px;
    width: 100%;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ANKITA'S AKSHAT AI</h1>

<!-- LOGIN -->
<div id="loginBox">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<input id="msg" placeholder="Ask something">
<button onclick="sendMsg()">Send</button>

<!-- IMAGE -->
<input type="file" id="file">
<img id="preview" class="preview">
<button onclick="upload()">Generate Caption</button>

</div>

<script>

let token = "";

function add(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* LOGIN */
async function login(){
    let form = new FormData();
    form.append("username", username.value);
    form.append("password", password.value);

    let res = await fetch("/login", {
        method: "POST",
        body: form
    });

    let data = await res.json();
    token = data.access_token;

    alert("Login Success");
    loginBox.style.display = "none";
}

/* CHAT */
async function sendMsg(){
    let msg = document.getElementById("msg").value;
    add(msg, "user");

    let res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type":"application/json",
            "Authorization":"Bearer " + token
        },
        body: JSON.stringify({message: msg})
    });

    let data = await res.json();
    add(data.reply, "bot");
}

/* IMAGE */
file.onchange = e => {
    preview.src = URL.createObjectURL(e.target.files[0]);
    preview.style.display = "block";
};

async function upload(){
    let form = new FormData();
    form.append("file", file.files[0]);

    let res = await fetch("/upload-image", {
        method: "POST",
        body: form
    });

    let data = await res.json();
    add("🖼 " + data.caption, "bot");
}

</script>

</body>
</html>
