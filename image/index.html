<!DOCTYPE html>
<html>
<head>
<title>ANKITA'S AKSHAT AI IMAGE CAPTION CHATBOT</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: 700px;
    margin-top: 20px;
}

h1 {
    text-align: center;
}

.chat {
    height: 350px;
    overflow-y: auto;
    background: #111827;
    padding: 10px;
    border-radius: 10px;
}

.msg {
    padding: 8px;
    margin: 5px;
    border-radius: 8px;
}

.user { background: #374151; text-align: right; }
.bot { background: #1d4ed8; }

.preview {
    width: 100%;
    margin-top: 10px;
    display: none;
    border-radius: 10px;
}

input, button {
    padding: 10px;
    margin: 5px;
    width: 100%;
    border-radius: 6px;
    border: none;
}

button {
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1e40af;
}
</style>
</head>

<body>

<div class="container">

<h1>🤖 ANKITA'S AKSHAT AI</h1>

<!-- LOGIN -->
<div id="loginBox">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat"></div>

<input id="msg" placeholder="Ask something (including about image)">
<button onclick="sendMsg()">Send</button>

<!-- IMAGE -->
<input type="file" id="file">
<img id="preview" class="preview">

<button onclick="upload()">Generate Caption</button>
<button onclick="readCaption()">🔊 Read Caption</button>

</div>

<script>

let token = "";
let lastCaption = "";

// DOM
const chat = document.getElementById("chat");
const username = document.getElementById("username");
const password = document.getElementById("password");
const file = document.getElementById("file");
const preview = document.getElementById("preview");
const loginBox = document.getElementById("loginBox");

/* ADD MESSAGE */
function add(text, type){
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* LOGIN */
async function login(){
    let form = new FormData();
    form.append("username", username.value);
    form.append("password", password.value);

    try {
        let res = await fetch("/login", {
            method: "POST",
            body: form
        });

        let data = await res.json();

        if (!data.access_token) {
            alert("Login failed");
            return;
        }

        token = data.access_token;
        console.log("TOKEN:", token);

        alert("✅ Login Success");
        loginBox.style.display = "none";

    } catch {
        alert("Server error");
    }
}

/* CHAT */
async function sendMsg(){

    if (!token){
        alert("Please login first");
        return;
    }

    let msg = document.getElementById("msg").value;

    if (!msg) return;

    add(msg, "user");

    try {
        let res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },
            body: JSON.stringify({message: msg})
        });

        let data = await res.json();

        if (data.reply) {
            add(data.reply, "bot");
        } else {
            add("Error: " + JSON.stringify(data), "bot");
        }

    } catch {
        add("❌ Server error", "bot");
    }
}

/* IMAGE PREVIEW */
file.onchange = e => {
    if (!file.files[0]) return;

    preview.src = URL.createObjectURL(file.files[0]);
    preview.style.display = "block";
};

/* IMAGE UPLOAD */
async function upload(){

    if (!token){
        alert("Please login first");
        return;
    }

    if (!file.files[0]) {
        alert("Select image first");
        return;
    }

    let form = new FormData();
    form.append("file", file.files[0]);

    try {
        let res = await fetch("/upload-image", {
            method: "POST",
            headers:{
                "Authorization":"Bearer " + token   // ✅ FIXED
            },
            body: form
        });

        let data = await res.json();

        if (data.caption) {
            lastCaption = data.caption;
            add("🖼 " + lastCaption, "bot");
        } else {
            add("Image error: " + JSON.stringify(data), "bot");
        }

    } catch {
        add("❌ Upload failed", "bot");
    }
}

/* 🔊 READ CAPTION */
function readCaption(){

    if (!lastCaption){
        alert("No caption available");
        return;
    }

    let speech = new SpeechSynthesisUtterance(lastCaption);
    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    speechSynthesis.speak(speech);
}

</script>

</body>
</html>
