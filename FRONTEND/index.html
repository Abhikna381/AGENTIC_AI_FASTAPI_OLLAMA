<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 600px;
            margin-top: 50px;
        }

        .chat-box {
            border: 1px solid #334155;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            border-radius: 10px;
            background: #020617;
        }

        .message {
            margin: 10px 0;
        }

        .user {
            text-align: right;
            color: #38bdf8;
        }

        .bot {
            text-align: left;
            color: #5acb04;
        }

        .input-box {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px;
            margin-left: 5px;
            background: #22c55e;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .loading {
            font-style: italic;
            color: gray;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <h2>🤖 ANKITA'S AKSHAT Chatbot</h2>

    <div id="chat-box" class="chat-box"></div>

    <div class="input-box">
        <input id="input" placeholder="Ask something..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const API_URL = "http://127.0.0.1:8000";

    function addMessage(text, className) {
        const chatBox = document.getElementById("chat-box");

        const div = document.createElement("div");
        div.className = "message " + className;
        div.innerText = text;

        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;

        return div;
    }

    async function sendMessage() {
    const input = document.getElementById("input");
    const query = input.value;

    if (!query) return;

    addMessage(query, "user");
    input.value = "";

    const loadingMsg = addMessage("Thinking...", "bot loading");

    try {
        // Step 1: Send query
        const res = await fetch(`${API_URL}/chat?query=${encodeURIComponent(query)}`, {
            method: "POST"
        });

        const data = await res.json();
        const jobId = data.job_id;

        console.log("Job ID:", jobId);   // ✅ DEBUG

        // Step 2: Poll result
        let result = null;

        while (true) {
            await new Promise(r => setTimeout(r, 2000));

            const statusRes = await fetch(`${API_URL}/job-status?job_id=${jobId}`);
            const statusData = await statusRes.json();

            console.log("STATUS:", statusData);  // ✅ DEBUG

            if (statusData.status === "finished") {
                result = statusData.result;
                break;
            }

            if (statusData.status === "failed") {
                result = "❌ Error: " + statusData.error;
                break;
            }
        }

        loadingMsg.remove();
        addMessage(result, "bot");

    } catch (err) {
        console.error(err);
        loadingMsg.remove();
        addMessage("❌ Connection error", "bot");
    }
}

</script>

</body>
</html>
